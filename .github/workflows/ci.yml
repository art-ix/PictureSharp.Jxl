name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  managed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/PictureSharp.Jxl -c Release --no-build -o artifacts
      - name: Package consumer (JIT)
        run: |
          dotnet restore tests/AotConsumer
          dotnet run --project tests/AotConsumer -c Release --no-restore
      - name: Linux trimming and Native AOT
        run: bash scripts/verify-package-consumer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
