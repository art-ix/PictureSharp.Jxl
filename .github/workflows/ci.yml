name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/PictureSharp.Jxl -c Release --no-build -o artifacts
      - name: Package consumer (JIT)
        run: |
          dotnet restore tests/AotConsumer --source "${{ github.workspace }}/artifacts" --source https://api.nuget.org/v3/index.json
          dotnet run --project tests/AotConsumer -c Release --no-restore
      - name: Linux trimming and Native AOT
        if: runner.os == 'Linux'
        run: bash scripts/verify-package-consumer.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
