name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and private visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: Publish private pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          (cd artifacts && sha256sum *.nupkg *.snupkg > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "PictureSharp.Jxl $version (scaffold)" --notes-file "docs/releases/release-$version.md" artifacts/*.nupkg artifacts/*.snupkg artifacts/SHA256SUMS
